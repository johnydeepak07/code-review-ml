services:
  - type: web
    name: code-review-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python data/build_dataset.py && python model/train.py
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
